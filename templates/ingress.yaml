{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.componentLabels" (dict "root" . "component" "ingress") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: forge-web
                port:
                  number: 8013
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: forge-web
                port:
                  number: 8013
          # SPA bundle (Vite output, base path /static/forge/) — must
          # match BEFORE /static so Django staticfiles fallback applies
          # only to other prefixes (admin, rest_framework, etc.).
          - path: /static/forge
            pathType: Prefix
            backend:
              service:
                name: forge-frontend
                port:
                  number: 80
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: forge-web
                port:
                  number: 8013
          - path: /sso
            pathType: Prefix
            backend:
              service:
                name: forge-web
                port:
                  number: 8013
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: forge-web
                port:
                  number: 8015
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forge-frontend
                port:
                  number: 80
{{- end }}
