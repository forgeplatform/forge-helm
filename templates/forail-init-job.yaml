apiVersion: batch/v1
kind: Job
metadata:
  # Suffix with chart revision so re-installs / upgrades create a fresh Job
  # (Job spec is otherwise immutable and would prevent helm upgrade).
  name: forail-init-{{ .Release.Revision }}
  namespace: {{ include "forail.namespace" . }}
  labels:
    {{- include "forail.componentLabels" (dict "root" . "component" "init") | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "forail.componentLabels" (dict "root" . "component" "init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z forail-postgres 5432; do sleep 2; done
              echo "Waiting for redis..."
              until nc -z forail-redis 6379; do sleep 2; done
              echo "Dependencies ready."
      containers:
        - name: forail-init
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["/bin/bash", "/etc/forail/init.sh"]
          env:
            {{- include "forail.backendEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "forail.backendVolumeMounts" . | nindent 12 }}
            - name: scripts
              mountPath: /etc/forail/init.sh
              subPath: init.sh
              readOnly: true
      volumes:
        {{- include "forail.backendVolumes" . | nindent 8 }}
        - name: scripts
          configMap:
            name: forail-scripts
            defaultMode: 0755
