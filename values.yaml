# Forge Platform — Helm values
#
# Override per-environment with: helm install forge ./helm -f my-values.yaml

# ── Global ────────────────────────────────────────────────
namespace:
  # Let `helm install --create-namespace` handle creation, or pre-create the
  # namespace if you need to seed pull-secrets before the chart renders.
  create: false
  name: forge

# ── Images ────────────────────────────────────────────────
images:
  backend:
    repository: registry.cloudforyour.work/forge-platform/forge-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: registry.cloudforyour.work/forge-platform/forge-frontend
    tag: latest
    pullPolicy: IfNotPresent
  assistant:
    repository: registry.cloudforyour.work/forge-platform/forge-assistant
    tag: latest
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 15-alpine
  redis:
    repository: redis
    tag: 7-alpine
  opa:
    repository: openpolicyagent/opa
    tag: latest-rootless
  nginx:
    repository: nginx
    tag: 1.27-alpine
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: latest

imagePullSecrets:
  - name: harbor-pull

# ── Secrets ───────────────────────────────────────────────
# In production, manage via external secret operator. These are dev defaults.
secrets:
  postgresPassword: "changeme-postgres"
  forgeSecretKey: "changeme-replace-with-openssl-rand-hex-32-output-aaaaaaa"
  forgeBroadcastWebsocketSecret: "changeme-replace-with-openssl-rand-hex-32-output-bbbb"
  forgeAdminPassword: "changeme-admin"

# ── Forge configuration ───────────────────────────────────
forge:
  admin:
    user: admin
    email: admin@forge.local
  allowedHosts: "*"
  # NOTE: avoid the .local TLD — Avahi/mDNS (`mdns_minimal [NOTFOUND=return]`
  # in nsswitch.conf on most desktop Linux distros) intercepts every
  # `.local` lookup and bypasses /etc/hosts, which makes browser access
  # to a manually-mapped forge.local fail with "Server Not Found" even
  # though curl from the same host works. `.lan` has no such hijack.
  csrfTrustedOrigins: "http://forge.lan:30080,https://forge.lan:30443,https://forge.lan"
  # Set to false when serving over plain HTTP (test cluster). Forge's
  # custom_settings.py reads FORGE_COOKIE_SECURE for SESSION/CSRF cookies.
  cookieSecure: "false"
  node:
    name: forge-node
    type: hybrid
  tenancyEnabled: false
  otel:
    enabled: true
    endpoint: "http://forge-otel-collector:4317"
    serviceName: forge
    tracesSampler: parentbased_traceidratio
    tracesSamplerArg: "0.1"

# ── Postgres ──────────────────────────────────────────────
postgres:
  enabled: true
  user: forge
  database: forge
  storage:
    size: 8Gi
    storageClass: ""
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits:   { memory: 1Gi,   cpu: 1000m }

# ── Redis ─────────────────────────────────────────────────
redis:
  enabled: true
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests: { memory: 64Mi,  cpu: 50m }
    limits:   { memory: 256Mi, cpu: 500m }

# ── OPA (Policy-as-Code sidecar) ──────────────────────────
opa:
  enabled: true
  resources:
    requests: { memory: 64Mi,  cpu: 50m }
    limits:   { memory: 256Mi, cpu: 500m }

# ── OTel Collector ────────────────────────────────────────
otelCollector:
  enabled: true
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits:   { memory: 512Mi, cpu: 500m }

# ── Backend (web + task) ──────────────────────────────────
web:
  replicas: 1
  resources:
    requests: { memory: 512Mi, cpu: 200m }
    limits:   { memory: 2Gi,   cpu: 2000m }

task:
  replicas: 1
  # forge-task runs ansible-runner with podman, which needs a privileged
  # container and host cgroup namespace. This is k8s test-cluster style;
  # in prod consider a dedicated worker daemonset on isolated nodes.
  privileged: true
  hostCgroup: true
  resources:
    # 2Gi was OOM-killed during a single Demo Project sync + hello_world
    # run on a fresh cluster — receptor work units in /tmp die with the
    # pod and Forge cannot recover the in-flight job. 4Gi clears that
    # margin for the supervisord + dispatcher + receptor + ansible-runner
    # + EE container set; lower it only if the workload is well known.
    requests: { memory: 1Gi, cpu: 200m }
    limits:   { memory: 4Gi, cpu: 2000m }

# ── Frontend ──────────────────────────────────────────────
frontend:
  replicas: 1
  resources:
    requests: { memory: 32Mi,  cpu: 25m }
    limits:   { memory: 128Mi, cpu: 200m }

# ── Assistant (Ollama + ChromaDB + RAG, all-in-one image) ─
assistant:
  enabled: false
  # gemma3:1b is the default; for higher quality at the cost of
  # latency and memory, try llama3.1:8b (≈4.7GB) or mistral:7b (≈4.1GB).
  # Model is pulled on first pod start and persisted to the PVC, so
  # changing this requires either a fresh PVC or manual `ollama pull`.
  model: "gemma3:1b"
  logLevel: INFO
  storage:
    # Sized for gemma3:1b + nomic-embed-text + a few thousand chunks of
    # docs. Bump to 30Gi+ if switching to llama3.1:8b or larger corpora.
    size: 20Gi
    storageClass: ""
  resources:
    # Ollama + Chroma + uvicorn share this budget. gemma3:1b inference
    # peaks around 1.5GB; chunk indexing during first boot briefly spikes.
    requests: { memory: 1Gi, cpu: 250m }
    limits:   { memory: 4Gi, cpu: 2000m }

# ── Ingress ───────────────────────────────────────────────
ingress:
  enabled: true
  className: traefik
  host: forge.lan
  tls:
    enabled: true
    # Pre-create the TLS secret in the forge namespace before upgrade:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout tls.key -out tls.crt -subj '/CN=forge.lan' \
    #     -addext 'subjectAltName=DNS:forge.lan'
    #   kubectl -n forge create secret tls forge-tls --cert=tls.crt --key=tls.key
    secretName: forge-tls

# ── Forge Operator ────────────────────────────────────────
# Operator (JobTemplate / Inventory / Credential / Schedule CRDs synced
# to the Forge REST API) is in its own repo and chart:
#   https://github.com/forgeplatform/forge-operator
# Install separately after Forge core is up:
#   1) kubectl -n forge exec deploy/forge-web -- forge-manage create_oauth2_token --user admin
#   2) helm install forge-operator <chart-path> -n forge \
#        --set forge.token=<PAT> --set forge.url=http://forge-web.forge.svc.cluster.local:8013
