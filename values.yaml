# Forail Platform — Helm values
#
# Override per-environment with: helm install forail ./helm -f my-values.yaml

# ── Global ────────────────────────────────────────────────
namespace:
  # Let `helm install --create-namespace` handle creation, or pre-create the
  # namespace if you need to seed pull-secrets before the chart renders.
  create: false
  name: forail

# ── Images ────────────────────────────────────────────────
images:
  backend:
    repository: ghcr.io/forail-platform/forail-backend
    tag: "2026.07.1"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/forail-platform/forail-frontend
    tag: "2026.07.0"
    pullPolicy: IfNotPresent
  assistant:
    repository: ghcr.io/forail-platform/forail-assistant
    # forail-assistant is NOT part of the 2026.07.0 release -- it ships
    # disabled (assistant.enabled=false below) and was not built or tested for
    # it, so this stays on the last published build. Pointing it at a tag that
    # was never pushed would give ImagePullBackOff the moment anyone enabled
    # it. Bump this in lockstep the next time the assistant is released.
    tag: "2026.06.0"
    pullPolicy: IfNotPresent
  assistantOllama:
    # Model server for the assistant. Pinned on purpose: the assistant image
    # used to carry a copy of the Ollama binary taken from `latest`, and an
    # upstream layout change broke inference silently. Bump deliberately.
    repository: ollama/ollama
    tag: "0.30.10"
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 15-alpine
  redis:
    repository: redis
    tag: 7-alpine
  opa:
    repository: openpolicyagent/opa
    # Pinned. This is the same image `latest-rootless` has served since
    # 2023-10-26 -- upstream stopped publishing `-rootless` variants after
    # 0.58.0, so that tag is a frozen orphan rather than a moving target, and
    # this pin changes nothing about what runs. (The earlier TODO here suggested
    # 0.70.0-rootless; that tag does not exist.)
    #
    # Moving off 0.58.0 means choosing a different image, not bumping a number,
    # and OPA 1.x defaults to Rego v1 -- so it needs the policies the backend
    # pushes to be checked first. Deliberately a separate decision.
    tag: 0.58.0-rootless
  nginx:
    repository: nginx
    tag: 1.27-alpine
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    # Pinned. Unlike OPA's, this `latest` really does move -- it was rebuilt on
    # 2026-08-18 -- so the same chart version was installing different collector
    # builds over time. 0.159.0 is the release `latest` points at today, so this
    # pin also changes nothing about what runs right now.
    tag: 0.159.0

# Public ghcr.io images do not require pull secrets.
# Override only when mirroring images to a private registry.
imagePullSecrets: []

# ── Secrets ───────────────────────────────────────────────
# The chart ships NO working secret defaults (see needtofix H3). Leave these
# empty and the chart will auto-generate the infrastructure secrets on first
# install and reuse them across upgrades (via a Secret lookup). In production,
# set them explicitly or manage via an external secret operator.
#
# forailAdminPassword has no safe auto-value (the operator must know it), so it
# is REQUIRED: `helm install` fails unless you provide one, e.g.
#   --set secrets.forailAdminPassword="$(openssl rand -base64 24)"
secrets:
  # Auto-generated when empty (override to pin an explicit value):
  postgresPassword: ""
  forailSecretKey: ""
  forailBroadcastWebsocketSecret: ""
  # Redis requirepass. A ClusterIP Service is reachable by every pod that can
  # route to it, and an unauthenticated Redis holds the cache, the task queue
  # and the websocket channel layer -- readable, writable, and one FLUSHALL from
  # empty. Generated on first install and reused on upgrade, like the others.
  redisPassword: ""
  # Bearer token the assistant requires on its chat endpoint. Only used when
  # assistant.enabled=true; generated on first install and reused on upgrade.
  # Whatever proxies /assistant to the Service must send it as
  # `Authorization: Bearer <token>` -- the chart does not expose the assistant
  # through the Ingress, deliberately, so nothing outside the cluster reaches it
  # until an operator routes it and configures that header.
  assistantChatToken: ""
  # Required — no default; install fails if unset:
  forailAdminPassword: ""

# ── Forail configuration ───────────────────────────────────
forail:
  admin:
    user: admin
    email: admin@forail.local
  # needtofix M9: do NOT default to "*" (Host-header injection → cache
  # poisoning / poisoned password-reset links). Keep the ingress host in sync
  # here; 127.0.0.1 and localhost MUST stay in the list because the in-cluster
  # liveness/readiness probes reach the app over the loopback address (Django
  # rejects any Host not listed with HTTP 400, which would crash-loop the pod).
  # The chart also appends the forail-web Service DNS names (forail-web,
  # forail-web.<ns>, forail-web.<ns>.svc, forail-web.<ns>.svc.cluster.local) to
  # whatever you set here, so in-cluster clients that call the Service directly
  # — forail-operator with
  # --set forail.url=http://forail-web.<ns>.svc.cluster.local:8013 — are not
  # rejected. Do not list them here yourself.
  allowedHosts: "forail.lan,127.0.0.1,localhost"
  # NOTE: avoid the .local TLD — Avahi/mDNS (`mdns_minimal [NOTFOUND=return]`
  # in nsswitch.conf on most desktop Linux distros) intercepts every
  # `.local` lookup and bypasses /etc/hosts, which makes browser access
  # to a manually-mapped forail.local fail with "Server Not Found" even
  # though curl from the same host works. `.lan` has no such hijack.
  csrfTrustedOrigins: "http://forail.lan:30080,https://forail.lan:30443,https://forail.lan"
  # needtofix M8: default Secure cookies on (ingress TLS is on by default).
  # Set to "false" only when serving over plain HTTP (e.g. a local dev run
  # without TLS). Forail's custom_settings.py reads FORAIL_COOKIE_SECURE for
  # SESSION/CSRF cookies.
  cookieSecure: "true"
  node:
    name: forail-node
    # control  — jobs run as separate Kubernetes pods, submitted to receptor as
    #            the "kubernetes-incluster-auth" work type. Everything this needs
    #            already ships in the chart: the worktype in receptor.conf, the
    #            namespaced pod RBAC in rbac.yaml, and MY_POD_NAMESPACE from the
    #            downward API. Needs no privileges anywhere.
    # hybrid   — the task pod runs jobs itself, through podman inside the
    #            container. That path REQUIRES task.privileged=true and
    #            task.hostCgroup=true below; without them podman fails on the
    #            overlay mount and every job stays Pending.
    #
    # This defaulted to hybrid while task.privileged defaulted to false, which is
    # the one combination that cannot run a job at all -- the safer half of each
    # pair, adding up to an install where the product's main function is broken.
    # The render now refuses that combination outright (see _helpers.tpl).
    type: control
  # ── Multi-tenancy ───────────────────────────────────────
  # tenancyEnabled alone used to be the only switch the chart offered, while the
  # controls that actually enforce isolation defaulted to off in the backend and
  # had no value here at all -- so turning it on gave the tenancy features
  # (quotas, branding, isolation auditing) with nothing enforcing a boundary.
  #
  # The chart now refuses that combination: tenancy.enabled=true requires
  # tenancy.rls=true. Set tenancy.strictIsolation=true to block cross-tenant
  # access rather than only audit it.
  tenancyEnabled: false
  tenancy:
    # Row-Level Security. Postgres policies scope rows to the requesting
    # tenant's organization; without it "multi-tenant" means only that the UI
    # shows a tenant name.
    rls: true
    # False audits cross-tenant access and allows it; true returns 403. Still
    # requires the organization's own tenant_isolation_strict flag.
    strictIsolation: false
    # Per-tenant API rate limiting. Needs Redis.
    rateLimiting: false
  otel:
    enabled: true
    endpoint: "http://forail-otel-collector:4317"
    serviceName: forail
    tracesSampler: parentbased_traceidratio
    tracesSamplerArg: "0.1"

# ── Postgres ──────────────────────────────────────────────
postgres:
  enabled: true
  user: forail
  database: forail
  storage:
    size: 8Gi
    storageClass: ""
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits:   { memory: 1Gi,   cpu: 1000m }

# ── Redis ─────────────────────────────────────────────────
redis:
  enabled: true
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests: { memory: 64Mi,  cpu: 50m }
    limits:   { memory: 256Mi, cpu: 500m }

# ── OPA (Policy-as-Code sidecar) ──────────────────────────
opa:
  enabled: true
  resources:
    requests: { memory: 64Mi,  cpu: 50m }
    limits:   { memory: 256Mi, cpu: 500m }

# ── OTel Collector ────────────────────────────────────────
otelCollector:
  enabled: true
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits:   { memory: 512Mi, cpu: 500m }

# ── Backend (web + task) ──────────────────────────────────
web:
  replicas: 1
  resources:
    requests: { memory: 512Mi, cpu: 200m }
    limits:   { memory: 2Gi,   cpu: 2000m }

task:
  replicas: 1
  # needtofix H4: forail-task runs ansible-runner with podman, which CAN want
  # a privileged container + host cgroup namespace. Both default OFF now — a
  # privileged pod with a host cgroup mount is a trivial container escape to
  # node-root. Opt in explicitly for the podman-in-pod execution path, and
  # isolate such workers onto dedicated tainted nodes:
  #   --set task.privileged=true --set task.hostCgroup=true
  privileged: false
  hostCgroup: false
  resources:
    # 2Gi was OOM-killed during a single Demo Project sync + hello_world
    # run on a fresh cluster — receptor work units in /tmp die with the
    # pod and Forail cannot recover the in-flight job. 4Gi clears that
    # margin for the supervisord + dispatcher + receptor + ansible-runner
    # + EE container set; lower it only if the workload is well known.
    requests: { memory: 1Gi, cpu: 200m }
    limits:   { memory: 4Gi, cpu: 2000m }

# ── Job-execution RBAC ────────────────────────────────────
# The forail-task scheduler launches every automation job as a pod in a
# Kubernetes container group; receptor manages those pods with the task pod's
# ServiceAccount. That account therefore needs namespaced pod RBAC — without it
# each launch fails ("pods is forbidden ... cannot list resource pods") and the
# job stays pending. See templates/rbac.yaml. Disable both only when you wire an
# external execution node and want no in-cluster job pods.
serviceAccount:
  create: true
  name: forail
rbac:
  create: true

# ── Frontend ──────────────────────────────────────────────
frontend:
  replicas: 1
  resources:
    requests: { memory: 32Mi,  cpu: 25m }
    limits:   { memory: 128Mi, cpu: 200m }

# ── Assistant (Ollama + ChromaDB + RAG, all-in-one image) ─
assistant:
  enabled: false
  # gemma3:1b is the default; for higher quality at the cost of
  # latency and memory, try llama3.1:8b (≈4.7GB) or mistral:7b (≈4.1GB).
  # Model is pulled on first pod start and persisted to the PVC, so
  # changing this requires either a fresh PVC or manual `ollama pull`.
  model: "gemma3:1b"
  logLevel: INFO
  storage:
    # ChromaDB index only — models live on the ollama claim below. Sized for
    # a few thousand chunks of docs; the corpus, not the model, drives this.
    # NOTE: this dropped from 20Gi when Ollama moved to its own Deployment.
    # PVCs cannot shrink, so an existing install needs a fresh claim.
    size: 5Gi
    storageClass: ""
  resources:
    # Chroma + uvicorn only; inference is no longer in this pod. Indexing
    # during first boot is the peak here.
    requests: { memory: 512Mi, cpu: 250m }
    limits:   { memory: 2Gi, cpu: 1000m }

  # ── Model server ────────────────────────────────────────
  # Runs as its own Deployment so that only it needs a GPU and a large volume.
  ollama:
    gpu:
      # Requests nvidia.com/gpu, which pins the pod to a node advertising the
      # device — so it stays off until the cluster actually has one and the
      # NVIDIA device plugin is installed. Without it Ollama runs on CPU.
      enabled: false
      count: 1
    nodeSelector: {}
    tolerations: []
    storage:
      # gemma3:1b (≈800MB) + nomic-embed-text with room to spare. Bump to
      # 30Gi+ before switching to an 8B-class model.
      size: 20Gi
      storageClass: ""
    resources:
      # CPU inference is memory-hungry and slow; on GPU most of the model
      # sits in VRAM instead. Sized for gemma3:1b — raise both alongside
      # `assistant.model`.
      requests: { memory: 2Gi, cpu: 500m }
      limits:   { memory: 6Gi, cpu: 4000m }

# ── Network policy (needtofix M11) ────────────────────────
# Off by default: k3s' default flannel CNI does not enforce NetworkPolicy, and
# a default-deny would silently do nothing there while breaking traffic on a
# CNI that DOES enforce it. Enable on a policy-capable cluster (Calico/Cilium)
# after validating: default-deny ingress + scoped allows between tiers so that
# Postgres:5432 / Redis:6379 are not reachable cluster-wide.
networkPolicy:
  enabled: false

# ── Pod hardening (needtofix M10, Codex M5) ───────────────
# These were empty, which meant every container kept its image's default UID and
# full capability set and could gain privileges through a setuid binary. Three
# workloads even had no value to set.
#
# What is on by default is the subset that is safe to assert without knowing the
# image: dropping all capabilities, refusing privilege escalation, and asking for
# the runtime's default seccomp profile. None of these grant anything an image
# legitimately needs at these ports -- the frontend is the one exception and gets
# NET_BIND_SERVICE back, because it binds :80.
#
# runAsNonRoot and readOnlyRootFilesystem are deliberately NOT defaulted. Both
# depend on what the image writes and which user it starts as (the postgres and
# redis entrypoints start as root and step down themselves), and asserting them
# blind turns a working install into CrashLoopBackOff. The recommended profile,
# once validated per image against your registry, is:
#
#   runAsNonRoot: true
#   runAsUser: <the image's own uid>
#   readOnlyRootFilesystem: true   # plus emptyDir mounts on its writable paths
#
# Set a workload's key to {} to opt out entirely.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  # Components whose PID 1 is already the unprivileged user, touching
  # nothing they do not own. These can drop everything.
  #
  # The task pod runs automation. When task.privileged=true (the podman-in-pod
  # execution path) the chart skips this block entirely -- the two cannot both
  # apply, and the privileged flag is the one the operator asked for.
  task: &hardened
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  assistant: *hardened
  assistantOllama: *hardened
  redis: *hardened
  opa: *hardened
  otelCollector: *hardened
  init: *hardened

  # These three start as root on purpose: they fix ownership on their own
  # runtime directories and then drop to their own user. Dropping ALL takes
  # CHOWN (and the setuid/setgid pair they drop with) away, so they never
  # reach the point of dropping privileges at all -- they die at startup:
  #
  #   nginx:    chown("/var/lib/nginx/body", 65534) failed (Operation not permitted)
  #   frontend: chown("/var/cache/nginx/client_temp", 101) failed (Operation not permitted)
  #   postgres: chown: /var/lib/postgresql/data/pgdata: Operation not permitted
  #
  # Granting exactly what the entrypoint needs keeps the rest of the drop
  # meaningful. This is still far short of running unconfined -- and it is
  # strictly better than the "hardened" version that did not run.
  #
  # NET_BIND_SERVICE: both nginx instances bind :80.
  web: &rootStartsThenDrops
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
  frontend: *rootStartsThenDrops
  # The postgres entrypoint also has to read and re-own an existing PGDATA
  # from a previous container, hence FOWNER and DAC_OVERRIDE. It binds 5432,
  # which is unprivileged, so no NET_BIND_SERVICE.
  postgres:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]

# ── Ingress ───────────────────────────────────────────────
ingress:
  enabled: true
  className: traefik
  host: forail.lan
  tls:
    enabled: true
    # Pre-create the TLS secret in the forail namespace before upgrade:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout tls.key -out tls.crt -subj '/CN=forail.lan' \
    #     -addext 'subjectAltName=DNS:forail.lan'
    #   kubectl -n forail create secret tls forail-tls --cert=tls.crt --key=tls.key
    secretName: forail-tls

# ── Forail Operator ────────────────────────────────────────
# Operator (JobTemplate / Inventory / Credential / Schedule CRDs synced
# to the Forail REST API) is in its own repo and chart:
#   https://github.com/forail-platform/forail-operator
# Install separately after Forail core is up:
#   1) kubectl -n forail exec deploy/forail-web -- forail-manage create_oauth2_token --user admin
#   2) helm install forail-operator <chart-path> -n forail \
#        --set forail.token=<PAT> --set forail.url=http://forail-web.forail.svc.cluster.local:8013
# That Service DNS name is covered by forail.allowedHosts automatically (see
# above). If you point the operator at the ingress host instead, or front it
# with another name, pass --set forail.hostHeader=<host in allowedHosts>.
